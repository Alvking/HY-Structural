process:
  eyebrow: Integrated delivery
  title: Inspection, design and construction in one coordinated workflow.
  body: >-
    One team keeps the technical decisions, site conditions and workmanship
    aligned from the first survey to final handover.
  integration:
    - index: '01'
      icon: ⌕
      title: Inspection
      body: >-
        Survey the structure, map defects, verify dimensions and identify the
        root cause.
      meta: Condition report • Test plan • Photo records
    - index: '02'
      icon: ◈
      title: Design
      body: >-
        Develop a practical strengthening scheme, method statement and
        coordinated scope.
      meta: Engineering concept • Details • Material schedule
    - index: '03'
      icon: ▤
      title: Construction
      body: >-
        Install, inspect and document the approved works with controlled site
        delivery.
      meta: HSE controls • Hold points • Handover file
  detailTitle: Detailed project path
  steps:
    - index: '1'
      title: Initial discussion
      body: >-
        Building type, observed problem, location, urgency and available
        drawings.
    - index: '2'
      title: Site investigation
      body: Condition survey, measurements, photographs and testing requirements.
    - index: '3'
      title: Engineering response
      body: >-
        Local registered-engineer input, strengthening concept, scope and
        budget.
    - index: '4'
      title: Specialist works
      body: >-
        Approved materials, method statements, HSE controls and inspection
        points.
    - index: '5'
      title: Verification & handover
      body: >-
        Testing, photographic records, completion documents and maintenance
        advice.
about:
  eyebrow: Why choose us
  title: >-
    Structural specialists who protect the building, the people and the
    programme.
  body: >-
    HY Structural Reinforcement Engineering Limited focuses on specialist
    strengthening and rehabilitation rather than treating structural work as
    ordinary building maintenance. Our local and international team combines
    condition assessment, engineering design, material selection, site
    supervision and documented quality control.
  points:
    - index: '01'
      title: Specialist diagnosis
      body: We identify the structural cause before selecting a repair.
    - index: '02'
      title: Integrated delivery
      body: Inspection, design and construction decisions stay coordinated.
    - index: '03'
      title: Risk-controlled execution
      body: Hold points, temporary works and records reduce avoidable site risk.
    - index: '04'
      title: Local collaboration
      body: Kenyan professionals and project stakeholders remain close to delivery.
  riskTitle: 'Why specialist experience matters:'
  riskBody: >-
    Structural strengthening involves load paths, temporary support, material
    compatibility and hidden defects. If carried out by a non-specialist
    contractor without proper assessment and design, the work may conceal
    damage, overload adjacent members, create unsafe temporary conditions, fail
    prematurely or expose the owner to approval and liability risks.
  image: /assets/images/cms/about/image.png
  imageAlt: Chinese and Kenyan structural engineers collaborating in a Nairobi office
