technologies:
  eyebrow: Professional strengthening technologies
  title: Match the repair method to the structural condition.
  body: >-
    Each technique is selected after inspection and engineering review. The
    examples below show typical quality conditions that may require the
    corresponding intervention.
  conditionLabel: 'Typical condition:'
  items:
    - index: '01'
      title: Steel plate bonding
      condition: >-
        Beam or slab capacity is inadequate, with limited space for heavy
        rebuilding.
      image: /assets/images/cms/technologies/items/0/image.png
      imageAlt: Steel plate pressure-grouting installation
    - index: '02'
      title: Bonded steel strengthening
      condition: >-
        Local bending or shear deficiency, overloaded members or damaged
        concrete sections.
      image: /assets/images/cms/technologies/items/1/image.png
      imageAlt: Bonded steel strengthening installation on a concrete column
    - index: '03'
      title: Carbon-fibre fabric (CFRP)
      condition: >-
        Cracked beams, slabs or columns requiring lightweight capacity
        improvement with minimal disruption.
      image: /assets/images/cms/technologies/items/2/image.png
      imageAlt: Carbon-fibre fabric strengthening of a concrete column
    - index: '04'
      title: Section enlargement
      condition: >-
        Significant loss of concrete section, insufficient reinforcement or
        major load increase.
      image: /assets/images/cms/technologies/items/3/image.png
      imageAlt: Concrete section enlargement work
    - index: '05'
      title: Rebar anchoring
      condition: >-
        New members, extensions or connections need reliable reinforcement
        anchorage into existing concrete.
      image: /assets/images/cms/technologies/items/4/image.png
      imageAlt: Post-installed rebar anchoring installation
    - index: '06'
      title: Crack repair & injection
      condition: >-
        Active or dormant cracks, water ingress, honeycombing or
        corrosion-related deterioration.
      image: /assets/images/cms/technologies/items/5/image.png
      imageAlt: Crack injection and concrete repair
    - index: '07'
      title: Load-bearing wall conversion
      condition: >-
        A load-bearing wall must be opened or removed to create a beam-supported
        layout.
      image: /assets/images/cms/technologies/items/6/image.png
      imageAlt: Load-bearing wall conversion with a new transfer beam
    - index: '08'
      title: High-ductility concrete
      condition: >-
        Seismic, impact or movement-prone zones require improved deformation
        tolerance and crack control.
      image: /assets/images/cms/technologies/items/7/image.png
      imageAlt: High-ductility concrete overlay installation
    - index: '09'
      title: Concrete column replacement
      condition: >-
        A column has severe crushing, corrosion or loss of section and requires
        staged replacement.
      image: /assets/images/cms/technologies/items/8/image.png
      imageAlt: >-
        Staged concrete column replacement with temporary shoring and new
        concrete
    - index: '10'
      title: Static-pressure anchor piles
      condition: >-
        Foundation settlement, insufficient bearing capacity or
        restricted-access underpinning where low vibration and compact equipment
        are required.
      image: /assets/images/cms/technologies/items/9/image.png
      imageAlt: Static-pressure anchor pile underpinning installation
conditions:
  eyebrow: Common defects & change-of-use
  title: Recognise the condition. Select the right intervention.
  body: >-
    Typical symptoms and treatment routes are grouped by structural system.
    Final solutions require site inspection, testing and engineering review.
  items:
    - index: '01'
      title: Masonry structures
      image: /assets/images/cms/conditions/items/0/image.png
      imageAlt: Masonry cracks, weathering and wall movement
      blocks:
        - heading: Common defects
          body: >-
            Diagonal, stepped and vertical compression cracks; weathered or
            powdery masonry; failed mortar joints; hollow finishes; dampness and
            salt efflorescence; missing ties; wall movement and inclination.
        - heading: Treatment methods
          body: >-
            Crack injection, pressure grouting, high-ductility concrete
            overlays, new wall ties, structural or buttress columns, correction
            and re-alignment, load-bearing wall support and controlled
            rebuilding where deterioration is severe.
    - index: '02'
      title: Timber structures
      image: /assets/images/cms/conditions/items/1/image.png
      imageAlt: Timber decay, termite damage and splitting
      blocks:
        - heading: Common defects
          body: >-
            Moisture-softened or decayed members, termite attack, section loss,
            splitting, excessive deflection, loose joints and decay where timber
            bears on damp masonry.
        - heading: Treatment methods
          body: >-
            Moisture-source control, local member repair or replacement, steel
            plate or section reinforcement, connection strengthening, added
            supports, preservative treatment and improved separation from damp
            masonry.
    - index: '03'
      title: Reinforced-concrete frames
      image: /assets/images/cms/conditions/items/2/image.png
      imageAlt: Concrete cracking, spalling and reinforcement corrosion
      blocks:
        - heading: Common defects
          body: >-
            Beam and slab cracking, column crushing, concrete spalling, exposed
            or corroded reinforcement, excessive deflection, honeycombing, weak
            joints and insufficient seismic detailing.
        - heading: Treatment methods
          body: >-
            Crack injection, concrete repair, CFRP or bonded steel
            strengthening, section enlargement, rebar anchoring, column
            jacketing or staged concrete replacement, joint strengthening and
            corrosion protection.
    - index: '04'
      title: Steel structures
      image: /assets/images/cms/conditions/items/3/image.png
      imageAlt: Steel corrosion, buckling and connection damage
      blocks:
        - heading: Common defects
          body: >-
            Corrosion and section loss, deflected members, local buckling,
            fatigue cracking, loose bolts, poor welds, damaged connections and
            insufficient capacity for new rooftop or equipment loads.
        - heading: Treatment methods
          body: >-
            Corrosion removal and protection, bolted or welded strengthening
            plates, member replacement, added bracing, connection upgrades,
            purlin reinforcement, load redistribution and controlled temporary
            support.
    - index: '05'
      title: Foundations
      image: /assets/images/cms/conditions/items/4/image.png
      imageAlt: Settlement cracks, footing rotation and uneven floors
      blocks:
        - heading: Common defects
          body: >-
            Differential settlement, diagonal wall cracking, uneven floors,
            footing rotation, inadequate bearing capacity, erosion,
            water-related soil softening and foundation concrete deterioration.
        - heading: Treatment methods
          body: >-
            Ground and drainage investigation, underpinning, footing
            enlargement, micropiles or local support, pressure grouting,
            reinforced-concrete repair, settlement monitoring, correction and
            structural re-levelling.
    - index: '06'
      title: Space expansion & change-of-use
      image: /assets/images/cms/conditions/items/5/image.png
      imageAlt: Structural constraints affecting space expansion
      blocks:
        - heading: Typical requirements
          body: >-
            Removing load-bearing walls, creating larger openings, changing room
            layouts, connecting spaces, adding floors or equipment and adapting
            buildings to a new commercial or institutional use.
        - heading: Treatment methods
          body: >-
            Temporary propping, transfer beams and frames, load-path
            verification, wall replacement with beams, new columns, local
            foundation strengthening, phased demolition and monitored
            construction.
    - index: '07'
      title: Load-capacity upgrades
      image: /assets/images/cms/conditions/items/6/image.png
      imageAlt: Overloaded slab, roof and column defects
      blocks:
        - heading: Typical requirements
          body: >-
            Higher storage, occupancy, machinery, solar-panel, water-tank or
            rooftop loads; changed design use; excessive vibration; or existing
            members that do not satisfy the required capacity.
        - heading: Treatment methods
          body: >-
            CFRP strengthening, bonded or encased steel, section enlargement,
            added reinforcement and supports, steel-member upgrades, foundation
            strengthening, load redistribution and verification testing.
materials:
  eyebrow: Materials, brands & specialist equipment
  title: >-
    Approved systems supported by professional tools and controlled
    installation.
  body: >-
    Final brands and product grades are selected against the engineer's
    specification, substrate condition, test requirements and verified local
    availability.
  brandsTitle: Representative material brands
  brands:
    - name: Sika
      body: >-
        concrete repair, bonding, injection, waterproofing and CFRP
        strengthening systems.
    - name: Hilti
      body: >-
        post-installed rebar, chemical anchors, fastening systems and
        professional installation tools.
    - name: Approved equivalent
      body: >-
        alternative international or locally available systems may be proposed
        after technical-data and compatibility review.
  selectionTitle: Selection principle
  selectionBody: >-
    No product is selected by brand name alone. Design capacity, approvals,
    substrate compatibility, installation conditions, shelf life and local
    technical support must be verified.
  equipment:
    - title: Inspection equipment
      image: /assets/images/cms/materials/equipment/0/image.png
      imageAlt: Professional structural inspection equipment set
      items:
        - Rebar scanner and cover meter
        - Concrete rebound hammer
        - Ultrasonic pulse testing equipment
        - Crack-width microscope and gauges
        - Laser level and displacement monitoring
        - Moisture meter and corrosion assessment tools
    - title: Strengthening equipment
      image: /assets/images/cms/materials/equipment/1/image.png
      imageAlt: Professional structural strengthening equipment set
      items:
        - Low-pressure crack-injection pumps
        - Adhesive and grout dispensing equipment
        - Diamond coring and drilling machines
        - Concrete scarifiers and dust extraction
        - CFRP rollers and substrate preparation tools
        - Hydraulic jacks and temporary support systems
    - title: Quality-control equipment
      image: /assets/images/cms/materials/equipment/2/image.png
      imageAlt: Professional strengthening quality-control equipment set
      items:
        - Anchor pull-out testing equipment
        - Torque-controlled installation tools
        - Adhesive temperature and mixing controls
        - Material batch and expiry tracking
        - Photographic inspection records
        - Calibrated measurement and acceptance tools
  note: >-
    Brand references indicate representative system capability and do not
    constitute an exclusive supply commitment. Products remain subject to
    project approval and procurement availability.
