process:
  eyebrow: 一体化交付
  title: 检测、设计与施工在同一协同流程中完成。
  body: 同一个团队从首次查勘到最终交付，保持技术决策、现场条件与施工质量的一致性。
  integration:
    - index: '01'
      icon: '⌕'
      title: 检测
      body: 查勘结构、绘制缺陷分布、复核尺寸并查明根本原因。
      meta: 状况报告 • 检测计划 • 影像记录
    - index: '02'
      icon: '◈'
      title: 设计
      body: 制定可实施的加固方案、施工方法与协同范围。
      meta: 工程方案 • 节点详图 • 材料清单
    - index: '03'
      icon: '▤'
      title: 施工
      body: 按批准方案实施、检查并记录，实现受控的现场交付。
      meta: 安全与健康控制 • 停检点 • 交付资料
  detailTitle: 详细项目流程
  steps:
    - index: '1'
      title: 初步沟通
      body: 建筑类型、已发现问题、位置、紧迫程度与可用图纸。
    - index: '2'
      title: 现场查勘
      body: 状况调查、测量、影像记录与检测需求。
    - index: '3'
      title: 工程响应
