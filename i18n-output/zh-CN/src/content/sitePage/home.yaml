technologies:
  eyebrow: 专业加固技术
  title: 让修复方法与结构实际状况相匹配。
  body: 每项技术均在检测与工程评审后确定。以下示例展示可能需要相应处理措施的典型状况。
  conditionLabel: 典型状况：
  items:
    - index: '01'
      title: 粘钢加固
      condition: 梁或板承载力不足，且不具备大规模重建的空间条件。
      image: /assets/images/cms/technologies/items/0/image.png
      imageAlt: 钢板压力注浆加固施工
    - index: '02'
      title: 型钢（外包钢）加固
      condition: 存在局部抗弯或抗剪不足、构件超载或混凝土截面受损。
      image: /assets/images/cms/technologies/items/1/image.png
      imageAlt: 混凝土柱外包型钢加固施工
    - index: '03'
      title: 碳纤维布（CFRP）
      condition: 梁、板、柱开裂，需要以较轻的自重提升承载力，并尽量减少干扰。
      image: /assets/images/cms/technologies/items/2/image.png
      imageAlt: 混凝土柱碳纤维布加固
    - index: '04'
      title: 增大截面
      condition: 混凝土截面损失较大、配筋不足或荷载显著增加。
      image: /assets/images/cms/technologies/items/3/image.png
      imageAlt: 混凝土增大截面施工
    - index: '05'
      title: 植筋锚固
      condition: 新增构件、扩建或连接需要可靠的钢筋锚固。
      image: /assets/images/cms/technologies/items/4/image.png
      imageAlt: 后植钢筋锚固施工
    - index: '06'
      title: 裂缝修补与灌浆
      condition: 活动性或静止裂缝、渗水、蜂窝麻面或锈蚀引起的劣化。
      image: /assets/images/cms/technologies/items/5/image.png
      imageAlt: 裂缝灌浆与混凝土修复
    - index: '07'
      title: 承重墙改造
      condition: 承重墙需要开洞或拆除，改为由梁承托的布局。
      image: /assets/images/cms/technologies/items/6/image.png
      imageAlt: 承重墙改造并新增托换梁
    - index: '08'
      title: 高延性混凝土
      condition: 抗震、抗冲击或易变形区域需要更好的变形能力与裂缝控制。
      image: /assets/images/cms/technologies/items/7/image.png
      imageAlt: 高延性混凝土面层施工
    - index: '09'
      title: 混凝土柱置换
      condition: 柱子严重压碎、锈蚀或截面损失，需要分段置换。
      image: /assets/images/cms/technologies/items/8/image.png
      imageAlt: 混凝土柱分段置换，含临时支撑与新浇混凝土
    - index: '10'
      title: 静压锚杆桩
      condition: 基础沉降、承载力不足，或场地受限、要求低振动与小设备的托换作业。
      image: /assets/images/cms/technologies/items/9/image.png
      imageAlt: 静压锚杆桩托换施工

conditions:
  eyebrow: 常见缺陷与用途变更
  title: 识别结构状况，选择正确的处理方式。
  body: 按结构体系归类典型症状与处理路线。最终方案需要现场检测、试验与工程评审。
  items:
    - index: '01'
      title: 砌体结构
      image: /assets/images/cms/conditions/items/0/image.png
      imageAlt: 砌体裂缝、风化与墙体位移
      blocks:
        - heading: 常见缺陷
          body: >-
            斜向、阶梯形与竖向受压裂缝；砖体风化粉化；灰缝失效；饰面空鼓；潮湿与泛碱；
            拉结件缺失；墙体位移与倾斜。
        - heading: 处理方法
          body: >-
            裂缝灌浆、压力注浆、高延性混凝土面层、新增拉结筋、构造柱或扶壁柱、纠偏复位、
            承重墙支撑，以及劣化严重时的控制性拆除重建。
    - index: '02'
      title: 木结构
      image: /assets/images/cms/conditions/items/1/image.png
      imageAlt: 木材腐朽、白蚁侵害与开裂
      blocks:
        - heading: 常见缺陷
          body: >-
            受潮软化或腐朽的构件、白蚁侵害、截面损失、开裂、挠度过大、连接松动，
            以及木构件支承在潮湿砌体处的腐朽。
        - heading: 处理方法
          body: >-
            切断潮源、局部构件修复或更换、钢板或型钢加固、节点加固、增设支撑、
            防腐处理，并改善与潮湿砌体的隔离。
    - index: '03'
      title: 钢筋混凝土框架
      image: /assets/images/cms/conditions/items/2/image.png
      imageAlt: 混凝土开裂、剥落与钢筋锈蚀
      blocks:
        - heading: 常见缺陷
          body: >-
            梁板开裂、柱压碎、混凝土剥落、钢筋外露或锈蚀、挠度过大、蜂窝麻面、
            节点薄弱与抗震构造不足。
        - heading: 处理方法
          body: >-
            裂缝灌浆、混凝土修复、碳纤维或粘钢加固、增大截面、植筋锚固、
            柱包钢或分段置换、节点加固与锈蚀防护。
    - index: '04'
      title: 钢结构
      image: /assets/images/cms/conditions/items/3/image.png
      imageAlt: 钢结构锈蚀、屈曲与节点损坏
      blocks:
        - heading: 常见缺陷
          body: >-
            锈蚀与截面损失、构件变形、局部屈曲、疲劳裂纹、螺栓松动、焊缝质量差、
            连接节点损坏，以及屋面或设备新增荷载下承载力不足。
        - heading: 处理方法
          body: >-
            除锈与防护、螺栓或焊接加强板、构件更换、增设支撑、节点升级、檩条加固、
            荷载重分配与受控临时支撑。
    - index: '05'
      title: 基础
      image: /assets/images/cms/conditions/items/4/image.png
      imageAlt: 沉降裂缝、基础转动与地面不平
      blocks:
        - heading: 常见缺陷
          body: >-
            差异沉降、墙体斜裂缝、地面不平、基础转动、地基承载力不足、水土流失、
            浸水软化与基础混凝土劣化。
        - heading: 处理方法
          body: >-
            地基与排水调查、基础托换、基础扩大、微型桩或局部支撑、压力注浆、
            钢筋混凝土修复、沉降监测、纠偏与结构复位。
    - index: '06'
      title: 空间改造与用途变更
      image: /assets/images/cms/conditions/items/5/image.png
      imageAlt: 影响空间扩展的结构限制
      blocks:
        - heading: 典型需求
          body: >-
            拆除承重墙、开设更大洞口、调整房间布局、连通空间、加层或增加设备，
            以及将建筑改造为新的商业或公共用途。
        - heading: 处理方法
          body: >-
            临时支撑、托换梁与框架、传力路径复核、以梁替换墙体、新增柱、
            局部基础加固、分阶段拆除与施工监测。
    - index: '07'
      title: 承载力提升
      image: /assets/images/cms/conditions/items/6/image.png
      imageAlt: 楼板、屋面与柱超载缺陷
      blocks:
        - heading: 典型需求
          body: >-
            更高的仓储、使用人数、机械、光伏、水箱或屋面荷载；设计用途变更；
            振动过大；或既有构件不满足承载要求。
        - heading: 处理方法
          body: >-
            碳纤维加固、粘钢或外包钢、增大截面、新增钢筋与支撑、钢结构构件升级、
            基础加固、荷载重分配与验证性检测。

